<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#12181F" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Search Console ownership verification. Must stay in the served
         HTML permanently — removing it un-verifies the property. -->
    <meta name="google-site-verification" content="TopGfwIK7lU-1G9SJPbLCwNjV3PWqf6FWHjEvKlhZTU" />
    <!-- Title, description, canonical and og:* below are the homepage values.
         scripts/prerender-routes.mjs overwrites them per route at build time —
         edit src/lib/pageMeta.data.json, not this file. -->
    <title>Reactor Design Explorer</title>
    <meta
      name="description"
      content="Simulate Batch, CSTR, and PFR reactors with custom multi-species kinetics — live 3D vessels, right in your browser."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Reactor Design Explorer" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Reactor Design Explorer" />
    <meta
      property="og:description"
      content="Simulate Batch, CSTR, and PFR reactors with custom multi-species kinetics — live 3D vessels, right in your browser."
    />
    <meta property="og:image" content="https://reactor-design-explorer-web.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Reactor Design Explorer — Batch, CSTR and PFR reactor simulator"
    />
    <meta property="og:url" content="https://reactor-design-explorer-web.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Reactor Design Explorer" />
    <meta
      name="twitter:description"
      content="Simulate Batch, CSTR, and PFR reactors with custom multi-species kinetics — live 3D vessels, right in your browser."
    />
    <meta name="twitter:image" content="https://reactor-design-explorer-web.vercel.app/og.png" />
    <!-- The prerendered static summary sits inside #root so Bing's analyser
         counts its <h1> (markup inside <noscript> does not count). React clears
         #root on mount, so it is gone the instant the app starts; hidden until
         then so it never flashes. With JavaScript off the app never runs and
         the rule below turns it into the visible page. -->
    <style>
      #seo-fallback {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <noscript>
      <style>
        #seo-fallback {
          position: static;
          width: auto;
          height: auto;
          margin: 0 auto;
          padding: 2rem 1.25rem;
          max-width: 42rem;
          overflow: visible;
          clip-path: none;
          white-space: normal;
          font-family: system-ui, sans-serif;
          line-height: 1.6;
        }
      </style>
    </noscript>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('reactor-design-explorer-theme');
          var theme = stored === 'light' ? 'light' : 'dark';
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
